# Pages CMS configuration — this file is what turns the GitHub repo into
# Kim's editing forms at app.pagescms.org. Field descriptions are written
# for Kim, in plain language: every one says what the field does on the page.
#
# NOTE: Pages CMS reads this file from the ROOT of its own GitHub repo. It
# becomes active when the site moves into the dedicated growing-with-gritty
# repo (PLAN.md §10) — the paths below assume that repo's root is this
# site/ folder.

media:
  input: public/images
  output: /images

content:
  - name: books
    label: Books
    type: collection
    path: src/content/books
    view:
      fields: [title, order]
      sort: [order]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: order
        label: Number in the series
        type: number
        required: true
        description: "1, 2, 3, 4 — controls the order books appear everywhere."
      - name: cover
        label: Cover image
        type: image
        required: true
        description: The cover as it appears on cards and the book's page.
      - name: ages
        label: Ages
        type: string
        description: 'Just the range, like "4–10".'
      - name: tagline
        label: One-line description
        type: string
        description: The single line under the title on book cards.
      - name: body
        label: About this book
        type: rich-text
        description: The full description on the book's own page.
      - name: lesson
        label: What did Gritty learn?
        type: text
        description: The takeaway, shown in its own green section on the book's page.
      - name: characters
        label: Who's in this story?
        type: select
        options:
          multiple: true
          values:
            - name: gritty
              label: Gritty the Goat
            - name: grandpa-goat
              label: Grandpa Goat
            - name: gabby
              label: Gabby the Goat
            - name: grandma-goat
              label: Grandma Goat
            - name: gibby
              label: Gibby the Goat
      - name: buyLink
        label: Buy link
        type: string
        description: >-
          Paste the full Amazon (or other store) address, starting with
          https://. The "Buy the book" button only appears once this is
          filled in.
      - name: challenge
        label: Grit challenge
        type: text
        description: >-
          A question families can talk about after reading. Shows in a
          speech bubble at the bottom of the book's page.
      - name: spreads
        label: Look inside — the spreads
        type: image
        list: true
        description: >-
          A few inside pages, in reading order. Kids swipe through these
          before the buy button. Upload the two-page spreads exactly as
          they appear in the book — this is the part a cover can't show.

  - name: characters
    label: Characters
    type: collection
    path: src/content/characters
    view:
      fields: [name, order]
      sort: [order]
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: order
        label: Order on the page
        type: number
        required: true
      - name: portrait
        label: Portrait
        type: image
        description: >-
          Your drawing of this character. Until one is uploaded, the site
          shows a friendly "portrait coming soon" circle.
      - name: role
        label: One-line description
        type: string
        description: 'Like "The little goat with big grit".'
      - name: body
        label: Their hello
        type: text
        description: >-
          What they say to visitors, in their own voice. Shows in
          handwriting-style lettering, so write it like they'd say it out
          loud — quotes and all.

  - name: printables
    label: Printables
    type: collection
    path: src/content/printables
    view:
      fields: [title, kind]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: kind
        label: What kind is it?
        type: select
        required: true
        options:
          values:
            - name: coloring-page
              label: Coloring page
            - name: discussion-cards
              label: Discussion cards
            - name: calm-down-cards
              label: Calm-down cards
            - name: poster
              label: Poster
            - name: journal
              label: Grit journal
            - name: certificate
              label: Certificate
            - name: book-guide
              label: Book guide
            - name: classroom-activity
              label: Classroom activity
      - name: audience
        label: Who is it for?
        type: select
        options:
          values:
            - name: kids
              label: Kids
            - name: parents
              label: Parents
            - name: teachers
              label: Teachers
            - name: everyone
              label: Everyone
      - name: download
        label: The PDF
        type: file
        required: true
        description: The file people download and print.
      - name: thumb
        label: Preview picture
        type: image
        description: Optional small picture shown on the download card.

  # ——— Gritty's World: the game content ———
  # Each game on the site reads from one of these lists. Adding an entry
  # adds it to the game — no code involved, ever.

  - name: scenarios
    label: Grit Zone challenges
    type: collection
    path: src/content/scenarios
    view:
      fields: [situation, order]
      sort: [order]
    fields:
      - name: order
        label: Order
        type: number
        required: true
        description: Challenges appear lowest number first.
      - name: situation
        label: The situation
        type: text
        required: true
        description: >-
          What's happening to Gritty? End with the question, like
          "What should he do?"
      - name: choiceA
        label: Choice A
        type: string
        required: true
      - name: choiceB
        label: Choice B
        type: string
        required: true
      - name: choiceC
        label: Choice C
        type: string
        required: true
      - name: answer
        label: Which choice shows grit?
        type: select
        required: true
        description: >-
          Mix it up between A, B, and C — if the grit choice is always in
          the same spot, kids figure that out fast!
        options:
          values:
            - name: a
              label: Choice A
            - name: b
              label: Choice B
            - name: c
              label: Choice C
      - name: cheer
        label: Gritty's cheer
        type: text
        description: >-
          What Gritty shouts when they pick the grit choice. If you leave it
          blank he says "That's grit! I have grit — I don't quit!"
      - name: hint
        label: Ask Gritty — his idea
        type: text
        description: >-
          What Gritty says when a child presses "Ask Gritty for an idea",
          in his own voice. Give a strategy to try, never the answer. Leave
          it blank and the button doesn't appear for this challenge.

  - name: mistakes
    label: Mistake Maker oopses
    type: collection
    path: src/content/mistakes
    view:
      fields: [oops, order]
      sort: [order]
    fields:
      - name: order
        label: Order
        type: number
        required: true
      - name: oops
        label: The funny oops
        type: text
        required: true
        description: >-
          Gritty's mistake, like "Gritty tried to draw a square… but it
          looks more like a potato!"
      - name: learned
        label: I learned…
        type: text
        description: >-
          The flip side, shown when kids press the big gold button. Finish
          the sentence "I learned:" — if you leave it blank, Gritty says
          "Mistakes help my brain learn!"

  - name: yet-sentences
    label: Power of YET sentences
    type: collection
    path: src/content/yet-sentences
    view:
      fields: [sentence, order]
      sort: [order]
    fields:
      - name: order
        label: Order
        type: number
        required: true
      - name: sentence
        label: The "I can't" part
        type: string
        required: true
        description: >-
          Just the tricky part, ending with … — like "I can't ride my
          bike…" The site adds the big gold YET!
      - name: tip
        label: Gritty's idea
        type: text
        description: >-
          One thing to try, shown after the gold YET — like "Read the word
          part by part." Leave it blank and Gritty says "YET is a magic
          word — it means your brain is still growing!"

  - name: calm-strategies
    label: Calming Corner strategies
    type: collection
    path: src/content/calm-strategies
    view:
      fields: [name, order]
      sort: [order]
    fields:
      - name: order
        label: Order
        type: number
        required: true
      - name: name
        label: Name
        type: string
        required: true
        description: 'Like "Take 5 slow breaths".'
      - name: icon
        label: Icon
        type: select
        description: >-
          The picture on the card. Leave blank for a plain leaf.
        options:
          values:
            - calm-breathe
            - calm-five-senses
            - calm-flower-candle
            - calm-kind-thought
            - calm-leaf
            - calm-movement
            - calm-talk-grown-up
            - calm-water
            - action-calm-break
            - action-try-again
            - action-ask-for-help
            - heart-kind
            - badge-star
      - name: steps
        label: The steps
        type: text
        description: >-
          How to do it, one step per line — each line becomes its own
          numbered step on the card.

  - name: meadow-chats
    label: Meadow chats
    type: collection
    path: src/content/meadow-chats
    view:
      fields: [opener, speaker, order]
      sort: [order]
    fields:
      - name: order
        label: Order
        type: number
        required: true
        description: Chats happen lowest number first, then start over.
      - name: speaker
        label: Who's talking?
        type: select
        required: true
        description: >-
          Gritty chats when kids tap him on the home page. Everyone else
          wanders up the meadow path to visit after a chat.
        options:
          values:
            - name: gritty
              label: Gritty the Goat
            - name: gabby
              label: Gabby the Goat
            - name: grandpa-goat
              label: Grandpa Goat
            - name: grandma-goat
              label: Grandma Goat
            - name: gibby
              label: Gibby the Goat
      - name: opener
        label: What they say first
        type: text
        required: true
        description: >-
          How the chat starts, in their own voice — a question works best,
          so kids have something to answer.
      - name: replyA
        label: Reply 1 — what a kid can say back
        type: string
        required: true
      - name: reactionA
        label: Reply 1 — how they react
        type: text
        required: true
      - name: moodA
        label: Reply 1 — Gritty's mood
        type: select
        description: >-
          How Gritty acts it out — a hop, a giggle, a proud double-hop with
          gold sparkles… Leave blank for a plain happy hop.
        options:
          values:
            - name: happy
              label: "Happy — a little hop"
            - name: laugh
              label: "Laughing — a giggly wiggle"
            - name: surprised
              label: "Surprised — a startled jump"
            - name: proud
              label: "Proud — double hop + gold sparkles"
            - name: thinking
              label: "Thinking — a slow sway"
      - name: replyB
        label: Reply 2 — what a kid can say back
        type: string
        required: true
      - name: reactionB
        label: Reply 2 — how they react
        type: text
        required: true
      - name: moodB
        label: Reply 2 — Gritty's mood
        type: select
        options:
          values:
            - name: happy
              label: "Happy — a little hop"
            - name: laugh
              label: "Laughing — a giggly wiggle"
            - name: surprised
              label: "Surprised — a startled jump"
            - name: proud
              label: "Proud — double hop + gold sparkles"
            - name: thinking
              label: "Thinking — a slow sway"
      - name: replyC
        label: Reply 3 — what a kid can say back (optional)
        type: string
      - name: reactionC
        label: Reply 3 — how they react
        type: text
      - name: moodC
        label: Reply 3 — Gritty's mood
        type: select
        options:
          values:
            - name: happy
              label: "Happy — a little hop"
            - name: laugh
              label: "Laughing — a giggly wiggle"
            - name: surprised
              label: "Surprised — a startled jump"
            - name: proud
              label: "Proud — double hop + gold sparkles"
            - name: thinking
              label: "Thinking — a slow sway"

  # Exactly one home page, so Kim gets a single form, not a list of one.
  - name: homepage
    label: Home page
    type: file
    path: src/data/homepage.json
    fields:
      - name: heroBubble
        label: Gritty's welcome (speech bubble)
        type: text
        description: >-
          The first thing visitors read, in Gritty's handwriting bubble,
          before anyone taps him.
      - name: heroSayings
        label: Gritty's sayings (they take turns)
        type: string
        list: true
        description: >-
          The lines Gritty's bubble cycles through while he waits to be
          tapped. Add or reorder freely — the first one shows first.
      - name: heroHeading
        label: Big headline
        type: string
      - name: heroTagline
        label: The line under the welcome paragraph
        type: string
      - name: heroText
        label: Welcome paragraph
        type: text

  - name: about
    label: About the Author
    type: file
    path: src/content/pages/about.md
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: headshot
        label: Your photo
        type: image
      - name: photo
        label: Second photo
        type: image
      - name: photoCaption
        label: Caption for the second photo
        type: string
      - name: body
        label: The page itself
        type: rich-text
